[package]
name = "pelancamic"
version = "0.1.0"
description = "PelancaMic PC Server"
authors = ["PelancaMic Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macros"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tokio = { version = "1", features = ["full"] }
cpal = { version = "0.15", features = ["jack", "pulse", "wasapi", "alsa"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"